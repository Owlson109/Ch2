const CONTENT={zh:[{"name": "9分鐘跑", "en": "9-minute run", "purpose": "評估心肺耐力；主要運用大腿前側股四頭肌、大腿後側肌群、臀肌及小腿肌。這是跑／行表現測試，並非直接量度最大攝氧量。", "equipment": "秒錶、18個雪糕筒、拉尺／滾尺輪、紀錄表、計算機、安全跑道。", "warm": "先步行或輕鬆慢跑，再做踝關節活動、提膝、輕柔腿部擺動等動態熱身；可按課堂要求加入短時間、無痛的專項伸展。", "steps": [["佈置與量度", "按筆記在標準籃球場放18個雪糕筒，參考每個相隔5米；實際量度整條路線，記錄一圈長度及標記間距，指出起點、方向和轉彎位置。", "「你會沿這條路線跑／行9分鐘，目標是完成自己能力範圍內最多的距離。」"], ["示範及試行", "示範起步、轉彎和通過起點；安排學員試行，確認沒有抄捷徑及明白路線。", "「起步時不用衝得太快；保持穩定節奏，需要時可以步行或暫停。」"], ["發令及計時", "確認學員準備好，發令「預備、開始」並同步啟動秒錶。", "「準備好嗎？預備、開始！」"], ["觀察與報圈", "站在能看清起點及大部分跑道的位置，逐圈記錄完整圈數；每圈報圈，可每分鐘報時，同時留意疲勞和不適。", "「已完成第＿圈，現在過了＿分鐘，保持你的節奏。」"], ["9分鐘叫停與定位", "到9分鐘立即叫停，記下當時所到的最近雪糕筒／路線位置；不要把停表後的步行算進成績。隨即引導正常完成者慢走。", "「時間到！我已記下你的位置，現在慢慢步行，讓呼吸逐漸回復。」"], ["計算及紀錄", "總距離＝完整圈數×實際每圈長度＋最後未完成一圈的距離；按路線標記量度尾段，記錄米數及量度方式。", "「你完成＿個整圈，最後一段＿米，合共＿米。」"]], "points": ["量度及說出實際圈長", "路線與跑行方向一致", "穩定配速，不要求一開始全速", "可步行／暫停，不逼學員硬撐", "逐圈報圈並準確計時9分鐘", "整圈及尾段分開記錄", "留意環境、學員反應及終止訊號"], "errors": [["起步太快", "「先用可維持的速度，調整呼吸和步幅。」"], ["抄捷徑／走錯路", "「請沿雪糕筒外側和指定方向前進。」"], ["胸痛、暈眩或明顯不適", "立即終止，通知導師並按現場應變流程處理，不要求繼續走完。"]], "record": "年齡、性別、日期、圈長（米）、完整圈數、尾段（米）、總距離（米）、中途休息或偏離路線等情況。", "analysis": "查男／女生表中的「9分鐘耐力跑」，再找實際年齡行及總米數所在範圍。相同條件下距離較長一般代表心肺耐力表現較好；不能只憑這項結果說整體體適能很好。", "direction": "從學員喜歡的有氧活動入手，思考如何按目前心肺水平及時間安排FITT；飲食方向可考慮均衡飲食及日常補水。先問平日活動習慣。", "cool": "正常完成後先慢走，待呼吸逐漸平穩，再帶領小腿、大腿前側和後側等靜態伸展；穩定保持、不彈震，詢問感覺。", "note": "筆記第三課第7頁文字寫每圈86米，第8頁圖示寫90米。本頁不預設圈長；考試以導師確認的路線及實際量度值計算。原表6–8歲是6分鐘跑，不能拿來評9分鐘跑。", "video": "https://www.youtube.com/watch?v=CG0qzl57Rcw"}, {"name": "三分鐘台階", "en": "3-minute step test", "purpose": "以運動後心率回復情況評估心肺功能；主要運用股四頭肌、臀肌及小腿肌。", "equipment": "12吋高（約30.5厘米）穩固台階／長櫈、96 bpm拍子機、秒錶、椅子、紀錄表。", "warm": "輕鬆步行／原地踏步，再做踝關節活動和輕柔提膝。先以慢速熟習上落台階，再短暫跟拍，避免練習至疲勞。", "steps": [["檢查器材", "確認台階12吋高、穩固不滑，旁邊留有空間；椅子放在能於完成後迅速坐下的位置。拍子機設96拍／分鐘。", "「這個測試要跟拍上落3分鐘，然後量度1分鐘的恢復脈搏。」"], ["示範四拍", "一拍一隻腳：「上、上、落、落」；上台後膝伸直，先上腳先落，一循環4拍，即每分鐘24循環。", "「看我示範：右上、左上、右落、左落；站上去時伸直膝，整隻腳掌放穩。」"], ["試做及確認", "讓學員短暫跟拍試做，觀察節奏、腳掌位置和平衡，再確認可開始。", "「請試跟四拍做一次。你明白節奏嗎？」"], ["連續測試3分鐘", "同步啟動秒錶與拍子機；清晰提示節奏，側面觀察伸膝和腳掌落點，同時留意疲勞、不適及失衡。", "「上、上、落、落，保持節奏，正常呼吸。」"], ["立即坐下量脈搏", "完成3分鐘後5秒內坐下，隨即以食指及中指輕按腕動脈，開始完整計數60秒。事前先熟悉找脈搏，避免完成後才摸索。", "「時間到，請立即坐下，放鬆手臂，我現在量度一整分鐘的脈搏，請先安靜休息。」"], ["紀錄與分析", "記錄完整60秒脈搏次數（次／分鐘），對照相同性別及年齡的常模。先量脈搏，之後才做其他cool down活動。", "「你的恢復心率是每分鐘＿次；現在我會按年齡和性別查表。」"]], "points": ["台階高度12吋且穩固", "96拍／分鐘，並非96次上落", "一循環4拍＝24循環／分鐘", "先上腳先落", "踏上時膝伸直、腳掌放穩", "先試跟拍後正式測試", "3分鐘結束後5秒內坐下", "完整量60秒，不能先散步再量"], "errors": [["漏拍／太快", "「跟著每一拍走一步：上、上、落、落。」"], ["只有前腳掌踏上／膝未伸直", "「整隻腳掌放穩，站上台階時伸直膝。」"], ["失衡或不適", "先保護學員，終止測試並通知導師；未按標準完成不能照常評級。"]], "record": "年齡、性別、台階高度、節拍、是否完成3分鐘、坐下及開始量脈搏的時間、60秒恢復脈搏（次／分鐘）、任何偏離程序。", "analysis": "按男／女士及年齡組查恢復心率範圍。相同測試條件下恢復心率較低一般代表較佳的心肺表現。原表由18歲起；未滿18歲或數值落在原表邊界缺口，請導師提供適用表或確認，不能自行補級別。", "direction": "從規律有氧活動、循序增加活動量及持續參與的方向構思FITT；飲食可考慮均衡飲食及補水。先了解學員對活動的喜好與時間。", "cool": "先坐下完成60秒恢復脈搏量度，再確認沒有不適，按情況慢走及帶領腿部靜態伸展。不要以cool down打亂恢復心率量度。", "note": "先量恢復心率，後做緩和活動。原表部分界線未涵蓋所有整數，例如男18–25歲的88和115；遇到這類結果，保留原數值並請導師確認。", "video": "https://www.youtube.com/watch?v=h6XlH-3Yc40"}, {"name": "坐地前伸", "en": "Sit & reach box test", "purpose": "評估腰背及大腿後側肌群（hamstrings）的柔軟度。此頁採用坐地前伸箱版本，並非YMCA地上長尺版本。", "equipment": "坐地前伸箱、地墊、紀錄表；確認腳跟所在位置為箱上23厘米，以配合筆記常模。", "warm": "先輕鬆步行／原地踏步，再做受控制的髖關節活動及輕柔腿部擺動；按課堂要求做舒適、無痛的腰背和大腿後側專項伸展，避免強拉或彈震。", "steps": [["檢查刻度", "把箱及地墊放穩，核對刻度和腳跟位置；此常模腳跟置於23厘米位置。", "「這個測試量度腰背和大腿後側的柔軟度，我會先示範。」"], ["設定坐姿", "學員脫鞋，面向箱坐於墊上，腳掌貼箱底板，雙腿與肩同寬，膝伸直。", "「請脫鞋，腳掌貼住底板，雙腿與肩同寬，保持直膝。」"], ["設定雙手", "雙手拇指可互扣，中指重疊放在箱面；兩手一齊向前，不要一手領先。", "「兩手疊好，中指對齊，讓指尖一起向前。」"], ["緩慢前伸", "指尖慢慢向前移，膝保持伸直；到最遠可控制、無痛的位置保持1秒。不要彈震或憋氣。", "「慢慢向前，保持直膝和正常呼吸；到最遠位置停1秒，不要彈。」"], ["讀數及重複", "保持1秒時讀取並記錄厘米數；共測3次，記錄每次有效成績，取最高值。屈膝／手不齊的無效嘗試須先糾正。", "「這次是＿厘米。稍作放鬆，我們一共測3次，取最好的一次。」"], ["查表與解釋", "用最高有效讀數，按年齡及性別查坐前伸箱常模；讀數保留箱上原刻度，不把23厘米任意扣除。", "「你3次有效成績中最高是＿厘米，按你的年齡和性別查表，屬於＿。」"]], "points": ["適量熱身、赤足", "箱固定、腳掌貼底板", "腳跟刻度23厘米", "雙腿與肩同寬、膝伸直", "中指重疊、兩手對齊", "慢慢前伸、不彈震", "最遠處保持1秒才讀數", "3次取最高，不取平均"], "errors": [["屈膝", "「請把膝伸直，稍退回一點，再慢慢前伸。」"], ["兩手不齊／彈震", "「中指對齊，一起慢慢伸，停住1秒。」"], ["想幫學員壓得更遠", "不要推背或強壓膝部；若需輕觸協助，先徵得同意，安全和動作有效性優先。"]], "record": "年齡、性別、箱及腳跟刻度位置、3次有效讀數（厘米）、最高成績、無效嘗試原因。", "analysis": "使用「坐前伸」箱版本常模，按性別及年齡查最高有效厘米數。讀數較高一般代表此測試的柔軟度表現較好，不能代表全身所有關節柔軟度，也不保證不會腰痛。", "direction": "思考如何安排腰背及大腿後側的柔軟度練習，並按FITT訂定可持續的習慣；留意無痛、控制和循序漸進。飲食方向以均衡及足夠水分作支持，不把某種食物說成能直接提升柔軟度。", "cool": "慢慢回到坐姿、放鬆腿部，再做舒適的輕柔靜態伸展，詢問腰背及腿後側有沒有不適；避免再次強拉到極限。", "note": "切勿把YMCA版腳跟15吋的讀數直接放入此常模。本頁所有分析均以箱版本、腳跟23厘米為準。", "video": "https://www.youtube.com/watch?v=0O3VYjoedPg"}, {"name": "手握力測試", "en": "Handgrip strength", "purpose": "量度手部及前臂肌群的最大等長肌力，特別是手指屈肌群；不能把握力直接當成所有上肢肌群的力量。", "equipment": "可調校握距的握力計、紀錄表，確認單位為公斤（kg）並歸零。", "warm": "輕柔活動手指、手腕和肩部，再以輕力度試握，熟悉器材；正式測試前不做大量用力握緊以免疲勞。", "steps": [["調握距與歸零", "調校手柄，以第二手指節握緊手柄為宜；檢查公斤單位及歸零，讓學員試持。", "「我先按你的手掌大小調整握距，讓第二手指節可以握好手柄。」"], ["示範站姿", "按中文筆記：垂直站立，手臂放身旁，肩膀放鬆；持握力計，指針／顯示面向外。", "「站直，手放身旁，放鬆肩膀，顯示面向外。」"], ["最大握緊", "確認準備好後，盡力握緊手柄，不擺動手臂、不靠軀幹借力，保持呼吸。", "「準備好便盡力握緊，手臂不要擺動，不要閉氣。」"], ["讀數與分手紀錄", "讀取公斤數，明確寫入左手或右手欄；每次重新檢查／歸零。", "「這次是左／右手＿公斤，我已記錄。」"], ["重複與休息", "左右手各測3次，每次之間休息30秒；可交替測左右手，但每次測試間仍保留休息。", "「先休息30秒，讓手部回復；左右手各做3次。」"], ["各取最好並相加", "找出左手最高及右手最高成績，把兩值相加，再對照筆記的雙手總和常模。", "「左手最高＿公斤，右手最高＿公斤，總和＿公斤，現在查表。」"]], "points": ["握距配合第二手指節", "每次檢查歸零及公斤單位", "站直、手臂放身旁", "顯示面向外", "肩放鬆、無其他手部或身體借力", "盡力握緊但保持呼吸", "左右各3次，每次休息30秒", "左最佳＋右最佳，非六次總和"], "errors": [["聳肩／手臂擺動", "「放鬆肩膀，手臂保持身旁，只用手握緊。」"], ["閉氣", "「繼續呼吸，不要憋住氣。」"], ["握距不合適或拿錯單位", "先停下調整、歸零及確認公斤；該次不作有效成績。"]], "record": "年齡、性別、左右手各3次公斤數、左手最高、右手最高、兩手最高總和（公斤）、休息和任何無效嘗試。", "analysis": "筆記常模是左右手相加的公斤數；用左最佳＋右最佳，按性別及年齡查表。不能只拿一隻手的讀數評雙手常模，亦不能用平均值代替。", "direction": "從前臂及握力的漸進阻力練習構思FITT，兼顧休息和學員目前能力；飲食可思考均衡飲食及足夠營養支持訓練。先問平日有沒有用手抓握的運動。", "cool": "放鬆雙手、輕柔開合手指及轉動手腕，再做舒適的前臂靜態伸展；詢問手腕、手指是否疼痛。", "note": "第21頁中文採站立、手放身旁；英文另載屈肘90度版本。本頁跟隨中文課堂步驟，不混用姿勢；以導師考試示範為準。", "video": "https://www.youtube.com/watch?v=jfcwsNMt8OE"}, {"name": "BMI", "en": "Body Mass Index", "purpose": "以身高和體重計算體重指標，作為體重狀況的篩查參考；不是肌力或肌耐力測試，不涉及某組肌肉的能力評分，也不能量出肌肉／脂肪比例。", "equipment": "身高尺、校準及歸零的體重磅、計算機、紀錄表、常模／參考表及有私隱的量度空間。", "warm": "BMI屬靜態身高體重量度，毋須運動熱身。先讓學員安靜準備；不要為了展示熱身而先讓學員做劇烈活動。", "steps": [["準備與私隱", "詢問年齡和性別，解釋量度；確認磅置於平坦硬地、歸零。先取得同意，不公開比較體重。", "「我會量度你的身高和體重，計算BMI；結果只作參考，我們會保密。」"], ["量身高", "脫鞋、移除影響讀數的頭飾，站直於身高尺，雙腳站穩、目視前方；身高尺橫板輕貼頭頂，讀取厘米。", "「請脫鞋，站直、望前，保持自然姿勢，我現在量身高。」"], ["量體重", "脫鞋、減少外套和袋中重物，站在磅中央、平均承重、不扶旁邊物件；讀數穩定才記錄公斤。", "「站在磅中央，放鬆、不扶東西，等讀數穩定。」"], ["換算及計算", "把身高厘米÷100轉成米。BMI＝體重（公斤）÷身高（米）²，保留原始數據及未取整的計算值作比較。", "「身高＿厘米即＿米，體重＿公斤；BMI是體重除以身高的平方。」"], ["選對參考表", "先核對表適用年齡；成人可參考筆記香港成人表，未成年人須用適用年齡及性別的兒童／青少年表。附件沒有青少年BMI常模，不硬套成人界線。", "「我會先確認這份表是否適合你的年齡，再解釋結果。」"], ["解釋限制", "按適用表說明體重狀況；指出BMI不能分辨脂肪與肌肉，較多肌肉者可能較高，仍需其他資料。", "「BMI只是一個體重參考指標，不能單靠這個數字判斷體脂或整體健康。」"]], "points": ["磅放平坦硬地並歸零", "脫鞋、自然站直量身高", "頭頂橫板正確放置", "減少額外衣物和重物", "磅中央站穩，讀數穩定才記錄", "厘米轉米再平方", "先核對年齡及參考表適用性", "保護私隱、尊重學員、不用嘲諷用語"], "errors": [["身高厘米直接代入", "「先除以100轉成米，再計算平方。」"], ["踮腳／扶物／磅未歸零", "調整姿勢和器材後重新量度，不能沿用錯誤數據。"], ["把BMI說成體脂率", "「BMI是體重指標，並不等於脂肪百分比。」"]], "record": "年齡、性別、身高（厘米及米）、體重（公斤）、BMI（kg/m²）、計算式、採用表及其適用年齡；沒有適用常模時註明待導師提供。", "analysis": "附件成人表：BMI＜18.5過輕；18.5≤BMI＜23適中；23≤BMI＜25過重；BMI≥25肥胖（表內術語）。以未取整值判斷，顯示可保留1位小數。青少年不能直接用這組成人界線定級；先取得適齡及性別常模。", "direction": "先了解飲食、日常活動及目標，再從均衡飲食、規律活動、睡眠和可持續生活習慣構思；如談運動需用FITT。不要只憑BMI要求減重或極端節食。", "cool": "單獨完成BMI沒有運動負荷，毋須生理性的cool down；說明原因並再次詢問身體感覺。如之前做過運動測試，按之前活動需要另作緩和。", "note": "附件未提供兒童／青少年BMI常模。若受測者未成年，先記錄數據與BMI，再向導師索取適用表，不以成人表定級。", "video": "https://youtu.be/8b1RQll9_E4"}, {"name": "SIT UP", "en": "1-minute sit-up", "purpose": "評估腹部肌耐力；主要涉及腹直肌及腹斜肌，完整起坐亦涉及髖屈肌。按筆記中文的一分鐘屈膝仰臥起坐版本。", "equipment": "軟墊、秒錶／計時器、紀錄表及協助固定足踝的同伴。", "warm": "先輕鬆踏步，再做受控制的軀幹及髖部活動，示範並試做少量標準起坐；避免熱身時大量起坐令腹肌疲勞。", "steps": [["準備與同意", "檢查軟墊平整和周圍空間，先解釋同伴會按住雙足踝；取得同意後安排同伴位置，不拉扯腳或坐在腳上。", "「這是一分鐘腹部肌耐力測試，同伴會輕穩地固定足踝，可以嗎？」"], ["起始姿勢", "仰臥墊上，屈膝約90度；雙臂交叉胸前，手掌放雙肩，同伴按住足踝。", "「膝屈約90度，雙手放雙肩，雙臂貼近胸前。」"], ["完整示範", "由仰臥向前上捲起，至肘觸大腿；還原至肩胛骨觸墊才完成一次，雙臂保持貼近上身。", "「上來時肘觸大腿，下去時肩胛骨觸墊，這樣才算一次。」"], ["試做與發令", "讓學員試做、糾正後，確認準備好。發令「預備、起」並同時啟動1分鐘計時。", "「先試一次。明白了嗎？預備、起！」"], ["觀察與計數", "側面觀察上下幅度，只報有效次數；未觸大腿或肩胛骨未回墊即不計。可報時；途中可休息再繼續，秒錶不停。", "「這次幅度不足，先不計；肘碰到大腿再落回墊。起來呼氣，落下吸氣。」"], ["1分鐘結束", "到60秒叫停，只記錄時間內完整有效次數；協助慢慢放鬆起身，對照性別及年齡常模。", "「時間到！你完成＿次有效起坐，我會記錄並查常模表。」"]], "points": ["屈膝約90度、足踝固定", "雙臂交叉胸前、手掌放雙肩", "雙臂緊貼上身", "肘觸大腿才達上端", "肩胛骨回到墊才完成一次", "只數有效完整動作", "60秒到即叫停", "可休息但計時不停", "上起呼氣、下降吸氣，不拉頸或甩動借力"], "errors": [["手臂離胸／甩動借力", "「雙手留在雙肩，雙臂貼近上身，用腹部帶動。」"], ["肘未觸大腿／肩胛骨未落墊", "「這次未完成，不計；請完成上下兩個位置。」"], ["頸或腰疼痛、暈眩", "立即停止，通知導師，記錄終止情況；不為湊足次數勉強完成。"]], "record": "年齡、性別、60秒有效次數（次）、無效動作及糾正、是否中途休息、是否提前終止。", "analysis": "用「一分鐘仰臥起坐」常模，按性別及年齡查有效次數。次數較多一般代表此動作的腹部肌耐力較好；不能拿其他捲腹幅度或不同時間的成績直接比較。", "direction": "從腹部／核心肌耐力練習及動作控制構思FITT，思考休息和如何逐步進階；飲食以均衡及足夠營養支持活動。先問有沒有核心訓練經驗或腰背不適。", "cool": "慢慢放鬆呼吸，不急速起身；按舒適程度作輕柔腹部及髖部靜態伸展，避免腰部過度後仰，最後詢問身體感覺。", "note": "以中文程序「肘觸大腿、肩胛骨觸墊」作有效次數標準；不能混用其他curl-up幅度。常模只適用於相同測試程序。", "video": "https://www.youtube.com/watch?v=Y8tNNb4lq6k"}],en:[{"name": "9-minute run", "en": "Cardiorespiratory endurance", "purpose": "Assess cardiorespiratory endurance through running or walking. Main working muscles: quadriceps, hamstrings, gluteals and calves. This is a performance test, not a direct measurement of VO₂max.", "equipment": "Stopwatch, 18 cones, measuring tape or wheel, record sheet, calculator and a safe course.", "warm": "Start with walking or easy jogging. Add ankle movements, knee lifts and controlled leg swings. If required in class, include brief, comfortable, test-specific stretches.", "steps": [["Set up and measure", "Place 18 cones around the basketball-court route, using the notes’ 5-metre spacing as a guide. Measure the actual lap and mark the start, direction, turns and intermediate distances.", "You will run or walk for 9 minutes. Try to cover the greatest distance you can safely manage."], ["Demonstrate the route", "Show the start, turns and start-line crossing. Let the participant try the route and check that they understand it.", "Start at a steady pace. You may walk or pause if needed."], ["Start the test", "Check readiness. Say “Ready, go!” and start the stopwatch at the same time.", "Are you ready? Ready, go!"], ["Observe and count", "Stand where you can see the start and most of the route. Record each completed lap, announce the lap count and give time updates each minute. Watch for fatigue or discomfort.", "You have completed lap __. __ minutes have passed. Keep your own steady pace."], ["Stop and mark the position", "At exactly 9 minutes, call time and note the nearest cone or route position. Do not include distance covered after the signal. Guide a participant who finishes normally into a slow walk.", "Time! I have marked your position. Walk slowly while your breathing settles."], ["Calculate and record", "Total distance = completed laps × measured lap length + distance covered in the final incomplete lap. Record metres and the method used to measure the last section.", "You completed __ full laps and __ metres in the last lap: __ metres in total."]], "points": ["Measure and state the actual lap length", "Use the same route and direction", "Start at a sustainable pace", "Allow walking or a pause when needed", "Count laps and time exactly 9 minutes", "Record complete laps and the last section separately", "Watch the course and the participant throughout"], "errors": [["Starting too fast", "Slow to a pace you can maintain. Adjust your breathing and stride."], ["Cutting corners or taking the wrong route", "Please follow the outside of the cones in the marked direction."], ["Chest pain, dizziness or clear distress", "Stop immediately, tell the teacher and follow the emergency procedure. Do not ask the participant to finish."]], "record": "Age, sex, date, measured lap length (m), completed laps, final section (m), total distance (m), pauses and any departure from the route.", "analysis": "Choose the boys’ or girls’ 9-minute table, find the correct age, then the total-distance range. Under the same conditions, a longer distance generally indicates better endurance in this test. Do not use the 6-minute table for a 9-minute result.", "direction": "Ask about usual activity, interests and available time. Consider a suitable aerobic activity and use FITT to plan progression. For diet, consider balanced meals and everyday hydration.", "cool": "After a normal finish, walk slowly until breathing settles. Then guide comfortable static stretches for the calves, quadriceps and hamstrings. Hold steadily without bouncing and ask how the participant feels.", "note": "The notes give 86 m per lap in Lesson 3, slide 7, but 90 m in slide 8. Use the teacher-confirmed route and its measured length. The original 6–8-year age rows are for a 6-minute test and are excluded here.", "video": "https://www.youtube.com/watch?v=CG0qzl57Rcw"}, {"name": "3-minute step", "en": "Recovery heart rate", "purpose": "Assess cardiorespiratory fitness using heart-rate recovery after exercise. Main working muscles: quadriceps, gluteals and calves.", "equipment": "A stable 12-inch (about 30.5 cm) step or bench, a metronome at 96 bpm, stopwatch, nearby chair and record sheet.", "warm": "Walk or march gently, then do ankle movements and light knee lifts. Practise the stepping pattern slowly, then briefly follow the beat. Avoid tiring the participant before the test.", "steps": [["Check the equipment", "Check the 12-inch step is stable and non-slip. Keep the area clear and place a chair close enough for an immediate seated recovery. Set the metronome to 96 beats per minute.", "Follow the beat for 3 minutes. Then I will count your recovery pulse for a full minute."], ["Show the four beats", "One foot moves on each beat: up, up, down, down. Straighten the knees when on the step. The foot that steps up first comes down first. Four beats make one cycle: 24 cycles per minute.", "Right up, left up, right down, left down. Put your whole foot securely on the step and straighten your knees."], ["Let the participant practise", "Allow a short practice. Check rhythm, foot position and balance. Confirm understanding before starting.", "Try following the four beats. Is the rhythm clear?"], ["Test for 3 minutes", "Start timing with the beat. Give clear rhythm cues and observe from the side. Check knee extension, footing, fatigue, balance and discomfort.", "Up, up, down, down. Keep the rhythm and breathe normally."], ["Sit and measure immediately", "At 3 minutes, have the participant sit within 5 seconds. Immediately locate the radial pulse with the index and middle fingers and count for a full 60 seconds. Practise locating the pulse before the test.", "Time. Please sit down now and relax your arm. Stay quiet while I count your pulse for one full minute."], ["Record and compare", "Record the full 60-second pulse count as beats per minute. Compare with the correct age and sex table. Finish pulse measurement before other cool-down activities.", "Your recovery heart rate is __ beats per minute. I will check the correct age and sex table."]], "points": ["Stable 12-inch step", "96 beats, not 96 complete cycles, per minute", "Four beats per cycle; 24 cycles per minute", "First foot up is first foot down", "Whole foot supported; knees straighten on top", "Practise before testing", "Sit within 5 seconds after the 3-minute test", "Count a full 60 seconds before walking or stretching"], "errors": [["Missing the beat", "Move one foot on each beat: up, up, down, down."], ["Only toes on the step or knees staying bent", "Place your whole foot securely and straighten your knees on top."], ["Loss of balance or discomfort", "Protect the participant, stop and tell the teacher. A non-standard or incomplete test cannot receive a normal rating."]], "record": "Age, sex, step height, beat rate, completion of 3 minutes, time seated and pulse-count start time, full 60-second recovery pulse (bpm), and any changes to the procedure.", "analysis": "Choose the correct sex and age row. Under the same test conditions, a lower recovery heart rate generally indicates better performance. This table starts at age 18. Some boundary values are missing and the age-65 bands overlap; ask the teacher rather than guessing.", "direction": "Ask about activity preferences and available time. Consider regular aerobic activity, gradual progression and consistency, using FITT. Add a suitable balanced-diet or hydration direction.", "cool": "First finish the seated 60-second pulse count. Check for discomfort, then use gentle walking and comfortable leg stretches as appropriate. Do not change the recovery-pulse measurement sequence.", "note": "Measure the recovery pulse before other cool-down activities. The original table omits some boundary values, such as 88 and 115 bpm for men aged 18–25. Keep the measured value and ask the teacher to confirm the rating.", "video": "https://www.youtube.com/watch?v=h6XlH-3Yc40"}, {"name": "Sit & reach", "en": "Flexibility", "purpose": "Assess lower-back and hamstring flexibility. This page uses the sit-and-reach box, not the YMCA floor-and-ruler version.", "equipment": "Sit-and-reach box, exercise mat and record sheet. The heel line must match the 23 cm position used by the notes’ norms.", "warm": "Begin with gentle walking or marching, controlled hip movements and light leg swings. Add comfortable lower-back and hamstring stretches as taught. Avoid forcing or bouncing.", "steps": [["Check the scale", "Secure the box and mat. Confirm that the heel line is at 23 cm on the scale.", "This test checks lower-back and hamstring flexibility. I will demonstrate first."], ["Set the seated position", "Remove shoes. Sit facing the box, with soles against its base, legs shoulder-width apart and knees straight.", "Place your feet against the box. Keep your legs shoulder-width apart and your knees straight."], ["Set the hands", "The thumbs may interlock. Overlap the middle fingers on the top of the box. Both hands reach together.", "Line up your middle fingers and move both hands together."], ["Reach slowly", "Move the fingertips forward slowly with straight knees. Hold the furthest controlled, pain-free position for 1 second. Do not bounce or hold the breath.", "Reach slowly, keep your knees straight and breathe normally. Hold for one second."], ["Read and repeat", "Read the scale during the 1-second hold. Record 3 valid trials and take the highest value. Correct bent knees or uneven hands before accepting another trial.", "This trial is __ centimetres. Relax briefly. We will record three trials and use the best."], ["Compare the best result", "Use the highest valid reading with the matching age and sex box-test norms. Keep the box reading; do not subtract 23 cm.", "Your best valid result is __ centimetres. In the correct age and sex row, it is rated __."]], "points": ["Warm up and remove shoes", "Secure the box; soles touch its base", "Heel line at 23 cm", "Legs shoulder-width apart; knees straight", "Middle fingers overlap; hands stay level", "Reach slowly without bouncing", "Hold 1 second before reading", "Three trials; use the highest, not the average"], "errors": [["Bent knees", "Straighten your knees, ease back slightly and reach again slowly."], ["Uneven hands or bouncing", "Line up your middle fingers, reach together and hold still for one second."], ["Trying to push the participant further", "Do not push the back or force the knees down. Explain and obtain consent before any gentle assistance."]], "record": "Age, sex, box and heel-line setting, 3 valid readings (cm), best result and reasons for invalid attempts.", "analysis": "Use the box-test norms with the heel line at 23 cm. Find the age and sex row for the highest valid reading. A higher reading generally indicates better flexibility in this test, not flexibility at every joint or a guarantee against back pain.", "direction": "Consider regular lower-back and hamstring flexibility work using FITT. Focus on comfort, control and gradual progress. Balanced food and hydration support activity, but no specific food directly guarantees flexibility.", "cool": "Return slowly to sitting and relax the legs. Use gentle, comfortable static stretches. Ask about the lower back and hamstrings; avoid another forced maximum reach.", "note": "Do not use a YMCA result with its heel line at 15 inches in this table. The original girls’ age-17 row omits 23 cm; ask the teacher to confirm that boundary value.", "video": "https://www.youtube.com/watch?v=0O3VYjoedPg"}, {"name": "Handgrip", "en": "Muscular strength", "purpose": "Measure maximum isometric strength of the hand and forearm, especially the finger flexors. Grip strength does not directly measure every upper-body muscle.", "equipment": "Adjustable handgrip dynamometer and record sheet. Check the kilogram (kg) unit and zero the device.", "warm": "Gently move the fingers, wrists and shoulders. Try a light squeeze to become familiar with the device. Avoid repeated hard squeezing before testing.", "steps": [["Adjust and zero", "Adjust the handle so that the second finger joints can grip it properly. Check kilograms and zero. Let the participant hold it.", "I will adjust the grip to your hand size so your second finger joints can hold the handle."], ["Show the stance", "Follow the Chinese classroom notes: stand upright with the arm by the side, shoulder relaxed and the dial or display facing outwards.", "Stand upright, keep your arm at your side and relax your shoulder. Face the display outwards."], ["Squeeze maximally", "When ready, squeeze as hard as possible. Do not swing the arm or use the trunk for assistance. Keep breathing.", "Squeeze as hard as you can. Keep your arm still and do not hold your breath."], ["Record each hand", "Read kilograms and clearly identify left or right on the sheet. Check and zero before each trial.", "This left/right-hand trial is __ kilograms. I have recorded it."], ["Repeat with rest", "Test each hand 3 times. Allow 30 seconds between trials. The hands may alternate, but keep the rest interval.", "Rest for 30 seconds. We will complete three trials for each hand."], ["Add the two best values", "Select the best left-hand and best right-hand results, add them, then use the two-hand total norms.", "Your best left-hand result is __ kg and your best right is __ kg. The total is __ kg."]], "points": ["Adjust for the second finger joints", "Check zero and kilograms each time", "Stand upright with arm by the side", "Display faces outwards", "Relax shoulders; do not use body movement", "Maximum squeeze while breathing", "Three trials per hand; 30 seconds between trials", "Best left plus best right, not all six readings"], "errors": [["Shrugging or swinging the arm", "Relax your shoulder and keep your arm at your side. Squeeze with the hand."], ["Holding the breath", "Keep breathing. Do not hold your breath."], ["Wrong grip setting or unit", "Stop, adjust, zero and check kilograms. Do not accept the incorrect trial."]], "record": "Age, sex, all 3 left and 3 right readings (kg), best value for each hand, sum of both best values (kg), rest intervals and invalid attempts.", "analysis": "The notes use the sum of both hands in kilograms. Compare best left + best right with the age and sex row. Never use one hand, the average or the sum of all six trials.", "direction": "Ask about grip-related activities and experience. Consider progressive forearm and grip resistance work using FITT, with suitable rest. Add a balanced-diet and adequate-nutrition direction.", "cool": "Relax the hands, gently open and close the fingers and move the wrists. Add comfortable forearm static stretches. Ask about wrist or finger pain.", "note": "Lesson 2, slide 21 gives an arm-by-the-side position in Chinese but a 90-degree elbow position in English. This guide follows the Chinese classroom version. Do not mix protocols; follow the teacher’s confirmed exam demonstration.", "video": "https://www.youtube.com/watch?v=jfcwsNMt8OE"}, {"name": "BMI", "en": "Body mass index", "purpose": "Use height and weight to screen weight status. BMI is not a strength or endurance test and does not measure muscle or fat percentage.", "equipment": "Height measure, calibrated scales, calculator, record sheet, suitable reference table and a private measurement area.", "warm": "No exercise warm-up is needed for a static height-and-weight assessment. Let the participant prepare quietly; do not make them exercise vigorously before measuring.", "steps": [["Prepare and protect privacy", "Ask age and sex, explain the measurements and obtain consent. Place the scales on a hard, level floor and zero them. Do not publicly compare weights.", "I will measure your height and weight to calculate BMI. The result is a reference and will be kept private."], ["Measure height", "Remove shoes and headwear that affects the reading. Stand upright and look forwards. Lower the horizontal headpiece gently to the top of the head and record centimetres.", "Please remove your shoes, stand upright and look forwards in a natural position."], ["Measure weight", "Remove shoes, heavy outer clothing and heavy pocket items. Stand still in the centre of the scales with weight evenly supported, without holding another object. Record stable kilograms.", "Stand in the centre without holding anything. Wait until the reading is stable."], ["Convert and calculate", "Divide centimetres by 100 to obtain metres. BMI = weight in kilograms ÷ height in metres squared. Keep the original measurements and use the unrounded BMI for classification.", "Your height is __ cm, or __ m, and your weight is __ kg. BMI is weight divided by height squared."], ["Choose the right reference", "Check the table’s age range. Adults may use the Hong Kong adult table in the notes. Children and adolescents need an appropriate age- and sex-specific table; it is not supplied in the attachments.", "I will check that the reference table is suitable for your age before explaining your result."], ["Explain the limitations", "Describe weight status using an applicable table. Explain that BMI cannot distinguish muscle from fat. Other information is needed to assess health.", "BMI is a weight-status reference. It cannot tell us your body-fat percentage or overall health on its own."]], "points": ["Hard, level floor and zeroed scales", "Shoes off; natural upright height position", "Headpiece placed correctly", "Remove extra weight from clothes and pockets", "Stand still in the centre; wait for a stable reading", "Convert cm to m before squaring", "Check age and reference-table suitability", "Protect privacy and use respectful language"], "errors": [["Using centimetres in the formula", "Divide height by 100 to obtain metres, then square it."], ["Standing on toes, holding support or unzeroed scales", "Correct the position or device and remeasure. Do not reuse the incorrect reading."], ["Calling BMI a body-fat percentage", "BMI is a weight-status index, not a body-fat percentage."]], "record": "Age, sex, height (cm and m), weight (kg), BMI (kg/m²), calculation, reference table and its age range. Note when an appropriate table still needs to be supplied.", "analysis": "Adult reference: underweight <18.5; normal range 18.5 to <23; overweight 23 to <25; obese ≥25 (original table label). Classify the unrounded value; display to 1 decimal place if needed. Do not apply adult cut-offs to children or adolescents.", "direction": "Ask about food, activity and goals. Consider balanced meals, regular activity, sleep and sustainable habits. Use FITT for any activity plan. Do not prescribe weight loss or extreme dieting based on BMI alone.", "cool": "A stand-alone BMI assessment has no exercise load, so a physiological cool-down is not required. Explain this and check how the participant feels. If exercise tests were done earlier, cool down as those activities require.", "note": "The attachments do not include child or adolescent BMI norms. For a participant under 18, record measurements and BMI, then obtain an appropriate table from the teacher. Do not assign an adult category.", "video": "https://youtu.be/8b1RQll9_E4"}, {"name": "SIT UP", "en": "1-minute sit-up", "purpose": "Assess abdominal muscular endurance. Main muscles include rectus abdominis and obliques; full sit-ups also involve hip flexors. Use the one-minute bent-knee procedure in the Chinese notes.", "equipment": "Exercise mat, stopwatch or timer, record sheet and a partner to steady the ankles.", "warm": "March gently, then perform controlled trunk and hip movements. Demonstrate and practise a few correct sit-ups. Avoid tiring the abdominals with many repetitions.", "steps": [["Prepare and obtain consent", "Check the mat and surrounding space. Explain that a partner will hold the ankles and obtain consent. Do not pull the feet or sit on them.", "This is a one-minute abdominal-endurance test. May your partner gently hold your ankles?"], ["Set the starting position", "Lie on the mat with knees bent about 90 degrees. Cross the arms over the chest with palms on the shoulders. The partner steadies the ankles.", "Bend your knees to about 90 degrees. Put your hands on your shoulders and keep your arms against your chest."], ["Demonstrate one full repetition", "Curl forwards and upwards until elbows touch the thighs, then return until the shoulder blades touch the mat. Keep the arms close to the body. Both positions are needed for one complete repetition.", "Elbows touch thighs on the way up; shoulder blades touch the mat on the way down. That is one repetition."], ["Practise and start", "Let the participant try and correct the technique. Check readiness, say “Ready, go!” and start the one-minute timer.", "Try one first. Is that clear? Ready, go!"], ["Observe and count valid repetitions", "Observe from the side. Count only full valid repetitions; do not count missed thigh or mat contact. Give time updates. Rest is allowed, but the clock keeps running.", "That repetition was incomplete, so it does not count. Breathe out as you rise and in as you lower."], ["Finish at 60 seconds", "Call time at 60 seconds. Record only complete valid repetitions finished within the time. Help the participant relax and rise slowly, then check the age and sex norms.", "Time! You completed __ valid repetitions. I will record the result and check the norms."]], "points": ["Knees about 90 degrees; ankles steadied", "Arms crossed; palms on shoulders", "Keep arms against the body", "Elbows touch thighs at the top", "Shoulder blades return to the mat", "Count only full valid repetitions", "Stop at 60 seconds", "Rest is allowed but the timer continues", "Breathe out on rising and in on lowering; do not pull the neck or swing"], "errors": [["Arms leaving the chest or swinging", "Keep your hands on your shoulders and arms close to your body. Use your abdominals."], ["Elbows or shoulder blades missing the required contact", "That does not count. Complete both the top and bottom positions."], ["Neck or back pain, or dizziness", "Stop, tell the teacher and record the reason. Do not force the participant to continue."]], "record": "Age, sex, valid repetitions in 60 seconds, invalid movements and corrections, any rests and any early termination.", "analysis": "Use the one-minute sit-up table for the correct age and sex. More valid repetitions generally indicate better endurance in this movement. Do not compare a different curl-up range or test duration with this table.", "direction": "Ask about core-training experience and back discomfort. Consider abdominal/core endurance and movement control using FITT, with rest and gradual progression. Add a balanced-diet direction to support activity.", "cool": "Relax the breathing and avoid getting up suddenly. Use gentle, comfortable abdominal and hip static stretches without excessive lower-back extension. Ask how the participant feels.", "note": "Follow the Chinese criteria: elbows touch thighs and shoulder blades touch the mat. Do not mix in another curl-up range. Norms apply only to the matching test procedure.", "video": "https://www.youtube.com/watch?v=Y8tNNb4lq6k"}]},NORMS={"0": [["男生｜9分鐘跑（米）", [["9", "≤1000", "1001-1097", "1098-1270", "1271-1370", "≥1371"], ["10", "≤1040", "1041-1130", "1131-1290", "1291-1400", "≥1401"], ["11", "≤1070", "1071-1170", "1171-1350", "1351-1460", "≥1461"], ["12", "≤1120", "11 const UI={zh:{title:'測試與評估｜學生實習指南',brand:'測試與評估<br>考試實習指南',skip:'跳到主要內容',sideLabel:'選擇測試 · 06項',sideNote:'先理解，再示範。<br>準確記錄，查表後才分析。<br><br>下載後可離線使用；影片需要網絡。',footer:'單元二 · 運動及體適能教練<br>依課程筆記及2025中文評分紙整理',nav:'六個測試項目',lang:'English',theme:['深色模式','明亮模式'],speech:['遮住說話','顯示說話'],mode:['演練模式','完整指南'],print:'列印',top:'回到頂部 ↑',kicker:'學生考試實習指南',part:'項目',pills:['健康查詢','示範與指導','數據及常模'],jump:['開場','步驟','常模','建議','清單'],say:'可以這樣說',opening:'大家好，我是________________學校，________班的________________，我今天要進行「測試與評估」考試。',sections:['開場與健康查詢','器材與準備','熱身','詳細測試步驟','高分動作要點','觀察與糾正','記錄數據與常模分析','改善建議：只給方向','Cool down 與結語','考前自我檢查'],healthSay:'開始之前，請問你今天有沒有身體不適、受傷或痛楚？平時有沒有做運動，或做過這個測試？',health:'請學員填寫PAR-Q，逐項核對答案。若有「是」或不確定的答案，先交導師跟進並確認能否參與；不要只遞表便立即開始。',consent:'解釋目的、流程及可能不適，確認參與同意，按學校安排處理同意書。記錄姓名、年齡、性別、日期及測試員。',stop:'胸痛、暈眩、作嘔、嚴重疲倦、要求停止或器材故障：停止測試、通知導師，按現場應變流程處理。',stopSay:'測試時如果不舒服，請立即告訴我。你也可以隨時要求停止。',equipmentHint:'檢查器材及場地，安排學員站在看得清、聽得到的位置。',warmHint:'熱身及放鬆為教學示例，可配合課堂所學調整；測試標準保持一致。',warmSay:'正式測試前，我先帶你做相關熱身。請跟著我做，有不適便告訴我。',bmiWarm:'BMI是靜態量度，沒有運動負荷，所以不需要做運動熱身。',stepsIntro:'先示範，讓學員試做；正式測試時一邊觀察，一邊提供準確回饋。',pointsIntro:'9–10分級別要求五個或以上要點，並熟練、準確地示範。',errorHint:'回饋後再確認學員有沒有改好。身體接觸前先解釋並取得同意，不強迫協助。',record:'一定要記錄',analysis:'如何查表',normFlow:'測試版本 → 性別及年齡 → 成績範圍 → 程度 → 結果意義。年齡不適用或數值落在缺口，先請導師確認。',analysisSay:'你的成績是＿（單位）。按＿常模表，對照＿歲及性別，成績落在＿範圍，屬於＿程度。這表示你在＿方面的表現是＿。',noNorm:'我已記錄結果，但這份表不適用或沒有涵蓋這個數值，須先向導師確認，現在不能準確定級。',normTitle:['男生','女生'],stepTitle:['男士','女士'],units:['9分鐘距離（米）','恢復心率（次／分鐘）','坐前伸箱（厘米）','左最佳＋右最佳（公斤）','成人BMI（kg/m²）','一分鐘有效次數（次）'],headers:['年齡','劣','可','常','良','優'],stepHeaders:['年齡','欠佳','尚可','一般','良好','優異'],bmiHeaders:['體重狀況','成人BMI範圍（kg/m²）'],bmiLabels:['過輕','適中','過重','肥胖（原表術語）'],enlarge:'放大表格 ↗',scroll:'表格較寬時可向左右滑動。',normSource:'按附件原表重排，保留原有範圍及符號，不自動補缺口或改用新版常模。',sourcePages:['第三課第9–10頁','第三課第12頁','第二課第11–12頁','第二課第22–23頁','第一課第26頁','第二課第31–32頁'],reachGap:'腳跟刻度為23厘米。原表女生17歲的23厘米未有評級，請導師確認。',practice:'口頭分析練習｜填好，再自己說',draftHint:'只在目前頁面保留，重新開啟會清除；不會自動評級。請勿輸入真實姓名或健康資料。',fieldLabels:['年齡／性別','結果及單位','查到的常模範圍','程度與結果意義','我的分析句'],placeholders:['例如：16歲，男','記錄原始數據及最終成績','從適用的表中查找','依原表填寫','說清楚用哪份表、為何屬於這個程度及代表甚麼。'],clear:'清除此項練習',fit:['每週頻率','合適強度','每次時間','活動種類'],adviceIntro:'請自行選活動、訂數值及解釋理由，按學員情況組織建議。',adviceList:['先問：目前習慣、經驗、喜好、可用時間及目標。','按結果：需要改善哪一方面？為何所選活動適合？','填好FITT：每週幾次、如何控制強度、做多久、做甚麼。','加入一項切合情況的飲食方向，避免極端限制或誇大功效。','最後交流：是否可行？有甚麼困難？怎樣調整及稍後重測？'],adviceMark:'「優良」要求合適的FITT及飲食建議，並與學員互動；本頁刻意不提供固定處方。',closing:'現在感覺如何？有沒有不舒服？對結果或建議有沒有問題？謝謝你的參與，今天的測試完成。',coolHint:'有次序地帶領合適的緩和活動，解釋目的並觀察反應。BMI及台階測試按各自程序處理。',rubric:'五大範疇各10分，共50分：知識及技巧、示範及解說、指導、數據分析、個人表現。',checklist:['開場；詢問健康狀況及已有經驗，填寫並核對PAR-Q','取得同意，確認年齡、性別及紀錄資料','說出目的和相關肌肉／部位；BMI說明是靜態量度','檢查器材及環境，讓學員看得清、聽得到','有序熱身；BMI說明毋須熱身','示範並講解至少五個動作／量度要點','安排試做、觀察、糾正並確認理解','記錄原始數據、單位及最終成績','用適用常模表說出程度並解釋','自行提出合適FITT及飲食方向，詢問學員意見','按需要cool down、詢問感覺並完成結語'],progress:'已準備',progressNote:'這是自我檢查，不是考試分數。',clothes:'服飾不符要求（如校服、非運動物料衣褲或沒有運動鞋）一律扣3分。主動協助組員，展現責任感。',reset:'重設此項清單',sources:'教材依據及示範影片',sourceText:'依三份《體適能測試與評估》筆記及2025中文評分紙整理；以中文課堂程序為基礎。程序差異及常模缺口已在各項目標示。示範句、熱身及放鬆屬學習輔助。',video:'筆記所列示範影片 ↗',videoHint:'需要網絡；影片語言不會隨介面切換。',close:'關閉 ✕',zoom:'放大字體 ＋',resetZoom:'重設大小',modalHint:'可在表格內上下、左右捲動。按Esc或「關閉」返回。'},
en:{title:'Fitness test & assessment | Student guide',brand:'Fitness assessment<br>Practical exam guide',skip:'Skip to main content',sideLabel:'SELECT A TEST · 06',sideNote:'Understand. Demonstrate.<br>Record accurately. Check the norms before interpreting.<br><br>Works offline after download. Videos need an internet connection.',footer:'Unit 2 · Exercise & Fitness Coaching<br>Based on the course notes and the 2025 assessment rubric',nav:'Six fitness tests',lang:'繁體中文',theme:['Dark mode','Light mode'],speech:['Hide scripts','Show scripts'],mode:['Rehearse','Full guide'],print:'Print',top:'Back to top ↑',kicker:'STUDENT PRACTICAL EXAM GUIDE',part:'TEST',pills:['Health screening','Demonstrate & coach','Record & interpret'],jump:['Opening','Steps','Norms','Advice','Checklist'],say:'YOU CAN SAY',opening:'Hello everyone. I am ________________ from class ________ at ________________ School. Today I am taking the Test and Assessment examination.',sections:['Opening & health screening','Equipment & preparation','Warm-up','Step-by-step procedure','Key points for high marks','Observe & correct','Record results & use norms','Advice: directions to develop','Cool-down & closing','Before the exam'],healthSay:'Before we start, do you feel unwell, have an injury or have any pain today? Do you exercise regularly or have you done this test before?',health:'Ask the participant to complete the PAR-Q and review each answer. If an answer is “yes” or uncertain, refer to the teacher and confirm whether participation is appropriate. Do not start immediately after handing over the form.',consent:'Explain the purpose, procedure and possible discomfort. Confirm consent and follow the school’s consent-form arrangements. Record name, age, sex, date and tester.',stop:'Stop and tell the teacher if there is chest pain, dizziness, nausea, severe fatigue, a request to stop or equipment failure. Follow the local emergency procedure.',stopSay:'Tell me immediately if you feel unwell. You can ask to stop at any time.',equipmentHint:'Check the equipment and venue. Position the participant so they can clearly see the demonstration and hear you.',warmHint:'Warm-up and cool-down activities are teaching examples. Adapt them to class learning while keeping the test protocol consistent.',warmSay:'Before the test, I will guide a suitable warm-up. Follow me and tell me if anything feels uncomfortable.',bmiWarm:'BMI uses static measurements without an exercise load, so an exercise warm-up is not needed.',stepsIntro:'Demonstrate, allow a practice and then test. Observe the participant and give specific feedback throughout.',pointsIntro:'The 9–10 mark band requires at least five key points and a fluent, accurate demonstration.',errorHint:'After feedback, check whether the movement improves. Explain and obtain consent before physical contact; never force assistance.',record:'What to record',analysis:'How to use the table',normFlow:'Protocol → sex and age → result range → rating → meaning. If the age is not covered or a value falls in a gap, ask the teacher first.',analysisSay:'Your result is __ (unit). In the __ reference table, for age __ and your sex, it falls in the __ range and is rated __. This suggests that your performance in __ is __.',noNorm:'I have recorded your result, but this table is not suitable or does not cover this value. I need to confirm with the teacher before giving an accurate rating.',normTitle:['Boys','Girls'],stepTitle:['Men','Women'],units:['9-minute distance (m)','Recovery heart rate (bpm)','Sit-and-reach box (cm)','Best left + best right (kg)','Adult BMI (kg/m²)','Valid repetitions in 1 minute'],headers:['Age','Poor','Fair','Average','Good','Excellent'],stepHeaders:['Age','Poor','Fair','Average','Good','Excellent'],bmiHeaders:['Weight status','Adult BMI range (kg/m²)'],bmiLabels:['Underweight','Normal range','Overweight','Obese (original table label)'],enlarge:'Expand table ↗',scroll:'Scroll horizontally inside a wide table.',normSource:'Reformatted from the supplied tables. Original ranges and symbols are retained; gaps are not filled and newer norms are not substituted.',sourcePages:['Lesson 3, slides 9–10','Lesson 3, slide 12','Lesson 2, slides 11–12','Lesson 2, slides 22–23','Lesson 1, slide 26','Lesson 2, slides 31–32'],reachGap:'Heel line: 23 cm. The original girls’ age-17 row does not classify 23 cm. Ask the teacher to confirm.',practice:'Practise your explanation | Write, then speak',draftHint:'Drafts stay only in this open page and clear when reopened. No automatic rating is given. Do not enter real names or health information.',fieldLabels:['Age / sex','Result and unit','Reference range found','Rating and meaning','My explanation'],placeholders:['Example: age 16, boy','Record the measurements and final result','Find this in the applicable table','Use the original rating','Name the table, explain the rating and say what the result means.'],clear:'Clear this draft',fit:['Frequency','Intensity','Time','Type'],adviceIntro:'Choose the activity, set values and explain your reasoning. Build advice around the individual participant.',adviceList:['Ask about current habits, experience, interests, available time and goals.','Use the result: what needs improvement, and why does the chosen activity fit?','Complete FITT: how often, how hard, how long and what activity?','Add one suitable dietary direction. Avoid extreme restriction or exaggerated claims.','Discuss feasibility, difficulties, adjustments and later retesting.'],adviceMark:'The top band asks for appropriate FITT and dietary advice with participant interaction. No fixed training prescription is supplied here.',closing:'How do you feel now? Any discomfort? Do you have questions about the result or advice? Thank you for taking part. The test is complete.',coolHint:'Guide a suitable sequence, explain its purpose and observe the response. Follow the specific BMI and step-test procedures.',rubric:'Five areas worth 10 marks each, total 50: knowledge and technique; demonstration and explanation; coaching; data analysis; individual performance.',checklist:['Introduce yourself; ask about health and experience; complete and review the PAR-Q','Obtain consent and confirm age, sex and record details','Explain the purpose and muscle groups; describe BMI as a static assessment','Check equipment and surroundings; ensure the participant can see and hear','Lead an organised warm-up, or explain why BMI needs none','Demonstrate and explain at least five movement or measurement points','Allow practice, observe, correct and confirm understanding','Record original measurements, units and the final result','Use applicable norms to give and explain the rating','Develop appropriate FITT and dietary advice; ask for feedback','Provide the required cool-down, check comfort and close the session'],progress:'Ready',progressNote:'This is a self-check, not an exam score.',clothes:'Unsuitable clothing (for example school uniform, non-sports clothing or no sports shoes) incurs a 3-mark deduction. Support your partners and show responsibility.',reset:'Reset this checklist',sources:'Sources & demonstration video',sourceText:'Based on the three Fitness Test and Assessment slide decks and the 2025 Chinese assessment rubric. The Chinese classroom procedures are used. Differences and gaps are flagged within each test. Scripts, warm-up and cool-down suggestions support learning.',video:'Demonstration video listed in the notes ↗',videoHint:'Internet required. The video’s spoken language does not change with this interface.',close:'Close ✕',zoom:'Larger text ＋',resetZoom:'Reset size',modalHint:'Scroll vertically or horizontally inside the table. Press Esc or Close to return.'}};

function render(){const d=CONTENT[lang][current],u=UI[lang];$('content').innerHTML=`<article id="panel" class="panel" role="tabpanel" aria-labelledby="tab-${current}"><header class="hero"><div class="eyebrow">${u.kicker} · ${u.part} ${String(current+1).padStart(2,'0')} / 06</div><h1>${esc(d.name)}</h1><p>${esc(d.purpose)}</p><div class="hero-bottom">${u.pills.map(s=>`<span>${s}</span>`).join('')}</div></header><div class="jump">${u.jump.map((s,i)=>`<a href="#${['opening','steps','norms','advice','checklist'][i]}">${s} ↗</a>`).join('')}</div><div class="notice warm">${esc(d.note)}</div>
<section class="card" id="opening">${title(0)}${say(u.opening,'opening')}${say(u.healthSay)}<p style="margin-top:16px">${u.health}</p><p class="detail-only muted">${u.consent}</p>${say(u.stopSay)}<div class="notice">${u.stop}</div></section>

<section class="card" id="norms">${title(6)}<h3>${u.record}</h3><p>${esc(d.record)}</p><h3>${u.analysis}</h3><p>${esc(d.analysis)}</p><div class="notice">${u.normFlow}</div>${say(u.analysisSay)}${say(u.noNorm)}<p class="tiny" style="margin-top:18px">${u.scroll}</p><div class="norm-grid">${Array.from({length:current===4?1:2},(_,k)=>`<div><div class="table-title"><h3>${esc(tableName(current,k))}</h3><button data-expand="${k}">${u.enlarge}</button></div>${tableHTML(current,k)}</div>`).join('')}</div>${current===2?`<div class="notice">${u.reachGap}</div>`:''}<p class="tiny">${u.normSource} ${u.sourcePages[current]}.</p></section>

<section class="card" id="checklist">${title(9)}<p class="muted">${u.rubric}</p><div class="progress"><div class="bar" id="bar"></div></div><p class="count" id="count" aria-live="polite"></p>${u.checklist.map((s,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${checks[current][i]?'checked':''}><span>${s}</span></label>`).join('')}<div class="notice warm">${u.clothes}</div><button id="resetChecks">${u.reset}</button></section><section class="card detail-only"><details><summary>${u.sources}</summary><p>${u.sourceText}</p><a href="${d.video}" target="_blank" rel="noopener">${u.video}</a><p class="tiny">${u.videoHint}</p></details></section></article>`;
document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>openTable(+b.dataset.expand));document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{checks[current][+b.dataset.check]=b.checked;progress()});document.querySelectorAll('[data-field]').forEach(el=>{el.value=drafts[current][el.dataset.field]||'';el.oninput=()=>drafts[current][el.dataset.field]=el.value});$('clearDraft').onclick=()=>{drafts[current]={};document.querySelectorAll('[data-field]').forEach(el=>el.value='')};$('resetChecks').onclick=()=>{checks[current].fill(false);document.querySelectorAll('[data-check]').forEach(el=>el.checked=false);progress()};progress();}
function progress(){const u=UI[lang],n=checks[current].filter(Boolean).length;$('bar').style.width=n/11*100+'%';$('count').textContent=`${u.progress} ${n} / 11 · ${u.progressNote}`}
function openTable(k){$('modalTitle').textContent=tableName(current,k);$('modalTable').innerHTML=tableHTML(current,k);$('modalTable').classList.remove('zoomed');$('viewer').showModal()}
$('close').onclick=()=>$('viewer').close();$('zoom').onclick=()=>$('modalTable').classList.add('zoomed');$('resetZoom').onclick=()=>$('modalTable').classList.remove('zoomed');$('viewer').addEventListener('click',e=>{if(e.target===$('viewer')){const r=$('viewer').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('viewer').close()}});
$('lang').onclick=()=>{const visible=[...document.querySelectorAll('section[id]')].find(el=>el.getBoundingClientRect().bottom>170);const id=visible?.id,offset=visible?.getBoundingClientRect().top;lang=lang==='zh'?'en':'zh';labels();render();savePrefs();if(id)requestAnimationFrame(()=>window.scrollBy(0,$(id).getBoundingClientRect().top-offset))};let themeTimer;
$('theme').onclick=()=>{
 clearTimeout(themeTimer);
 const motion=!matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(motion){document.body.classList.add('theme-changing');void document.body.offsetWidth;}
 dark=!dark;
 document.body.classList.toggle('dark',dark);
 $('theme').textContent=UI[lang].theme[+dark];
 $('theme').setAttribute('aria-pressed',String(dark));
 savePrefs();
 themeTimer=setTimeout(()=>document.body.classList.remove('theme-changing'),520);
};$('speech').onclick=()=>{hide=!hide;labels()};$('mode').onclick=()=>{rehearse=!rehearse;labels()};$('print').onclick=()=>window.print();$('topButton').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
const ro=new ResizeObserver(()=>{const h=document.querySelector('.top').getBoundingClientRect().height;document.documentElement.style.setProperty('--top-height',h+'px');document.documentElement.style.scrollPaddingTop=(h+(innerWidth<=1000?78:20))+'px'});ro.observe(document.querySelector('.top'));window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>{d.dataset.wasOpen=d.open;d.open=true}));window.addEventListener('afterprint',()=>document.querySelectorAll('details').forEach(d=>d.open=d.dataset.wasOpen==='true'));labels();render();
</script></body></html>
